name: Deploy Wahltrends information site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        env:
          WAHLTRENDS_LEGAL_NAME: ${{ secrets.WAHLTRENDS_LEGAL_NAME }}
          WAHLTRENDS_LEGAL_ADDRESS: ${{ secrets.WAHLTRENDS_LEGAL_ADDRESS }}
          WAHLTRENDS_CONTACT_EMAIL: ${{ secrets.WAHLTRENDS_CONTACT_EMAIL }}
          WAHLTRENDS_RESPONSIBLE_PERSON: ${{ secrets.WAHLTRENDS_RESPONSIBLE_PERSON }}
        run: python3 scripts/build_site.py "$RUNNER_TEMP/wahltrends-site"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/wahltrends-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
